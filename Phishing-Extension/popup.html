<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 300px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; background-color: #1a1d24; color: #ffffff; margin: 0; }
        h3 { color: #5c6bc0; margin-top: 0; font-size: 18px; text-align: center; }
        p { font-size: 13px; color: #a0a5b5; text-align: center; }
        button { background-color: #5c6bc0; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; transition: 0.3s; }
        button:hover { background-color: #3f51b5; }
        #result-box { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; text-align: center; font-weight: bold; }
        .safe { background-color: rgba(76, 175, 80, 0.2); border: 1px solid #4caf50; color: #4caf50; }
        .suspect { background-color: rgba(255, 152, 0, 0.2); border: 1px solid #ff9800; color: #ff9800; }
        .danger { background-color: rgba(244, 67, 54, 0.2); border: 1px solid #f44336; color: #f44336; }
    </style>
</head>
<body>
    <h3>Phishing Detector AI</h3>
    <p>Analyser l'onglet actuel en un seul clic</p>
    <button id="checkBtn">Analyser l'URL 🔍</button>
    <div id="result-box" id="resultText"></div>

    <script src="popup.js"></script>
</body>
</html>
